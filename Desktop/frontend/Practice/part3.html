<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Name attribute-->
    
    <form action="https://www.youtube.com/results" method="get">
        <input type="text" name="search_query" placeholder="Search YouTube">
        <button type="submit">Search</button>
    </form>
    <form action="https://in.search.yahoo.com/" method="get">
        <input type="text" name="p" placeholder="Search Yahoo">
        <button type="submit">Search</button>
    </form>

    <hr>
    <!--Checkbox-->
    <form action="">
        <input type="checkbox" name="vehicle1" value="Bike"> I have a bike<br>
        <input type="checkbox" name="vehicle2" value="Car"> I have a car<br>
        <input type="checkbox" name="vehicle3" value="Boat"> I have a boat<br>
        <button type="submit">Submit</button>
    </form>
    <!--using label-->
    <form action="/server">
        <input type="checkbox" id="age" name="age">
        <label for="age">I am over 18+</label>
    </form>
    <hr>
    <!--Radio button-->
    <input type="radio" id="apple" name="fruit" value="apple">
    <label for="apple">Apple</label>
    <input type="radio" name="fruit" id="banana">
    <label for="banana">Banana</label>
    <br><hr>
    <!--SElect element, Dropdown-->
    <select name="profession" id="profession">
        <option value="student">student</option>
        <option value="teacher">teacher</option>
        
    </select>


</body>
</html>
